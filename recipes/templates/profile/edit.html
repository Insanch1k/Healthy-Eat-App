{% extends 'health/base_generic.html' %}

{% block content %}

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="content-panel">
            <h2>Edit your profile:</h2>
            <form action="." method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>USERNAME:</label>
                    {{ user_form.username }}
                </div>
                <div class="form-group">
                    <label>FIRST NAME:</label>
                    {{ user_form.first_name }}
                </div>
                <div class="form-group">
                    <label>EMAIL:</label>
                    {{ user_form.email }}
                </div>
                <div class="form-group">
                    <label>LAST NAME:</label>
                    {{ user_form.last_name }}
                </div>
                <div class="form-group">
                    <label>PHONE:</label>
                    {{ profile_form.phone }}
                </div>
                <input type="submit" value="CHANGE" class="btn btn-success"><br>
                <a class="btn btn-small mt-4" href="{% url 'password_change' %}">Change your password</a>
            </form>

            </div>
        </div>
    </div>
{% endblock %}
