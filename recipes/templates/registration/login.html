{% extends 'health/base_generic.html' %}
{% load crispy_forms_tags %}

{% block title %}Login{% endblock %}

{% block content %}
    <div class="auth-box">
        <h2 class="text-center text-muted">Login</h2>
        <form action="." method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button class="btn btn-success mt-3" type="submit">Login</button>
            <p class="mt-3">Or <a href="{% url 'password_reset' %}">forgot password?</a></p>
        </form>
    </div>
{% endblock %}
