[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthy-eat-app"
version = "0.2.0"
description = "Production-ready Django application for healthy eating, diet programs, recipes, notes, and SMS reminders."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "Django~=5.2",
    "celery~=5.6",
    "django-celery-beat~=2.9",
    "django-celery-results~=2.6",
    "django-crispy-forms~=2.6",
    "crispy-bootstrap5~=2025.6",
    "django-embed-video~=1.4",
    "dj-database-url~=3.0",
    "gunicorn~=23.0",
    "Pillow~=12.2",
    "psycopg[binary]~=3.2",
    "redis~=7.0",
    "twilio~=9.8",
]

[project.optional-dependencies]
dev = [
    "coverage~=7.13",
    "pip-audit~=2.9",
    "pytest~=9.0",
    "pytest-django~=4.11",
    "ruff~=0.14",
]

[tool.setuptools.packages.find]
include = ["health*", "diets*", "recipes*", "news*", "notes*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "health.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["diets", "recipes", "news", "notes"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]
ignore = ["DJ001"]
